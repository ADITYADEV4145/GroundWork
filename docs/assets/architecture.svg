<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="510" viewBox="0 0 1440 510" role="img" aria-labelledby="title desc">
  <title id="title">Groundwork: your agent, grounded in your repository</title>
  <desc id="desc">Claude Code, Codex and Cursor use token-budgeted MCP tools to query a local SQLite index. Hooks refresh changed files, check calls after edits, and run duplicate checks at Stop. The index contains files, symbols, imports, calls and fingerprints parsed by tree-sitter. Everything runs locally; hooks fail open on error.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#b7f5cf" stroke-opacity=".035"/></pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b7f5cf"/></marker>
  </defs>
  <rect width="1440" height="510" rx="20" fill="#081314"/>
  <rect width="1440" height="510" rx="20" fill="url(#grid)"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="64" y="62" fill="#b7f5cf" font-size="16" letter-spacing="3">THE LOCAL CONTEXT LAYER</text>
    <text x="64" y="109" fill="#f3f5ed" font-size="33" font-weight="700">Your agent, grounded in your repository.</text>
    <g fill="#10221f" stroke="#345347"><rect x="64" y="164" width="300" height="240" rx="14"/><rect x="474" y="164" width="390" height="240" rx="14"/><rect x="974" y="164" width="402" height="240" rx="14"/></g>
    <g fill="#b7f5cf" font-size="14" letter-spacing="2"><text x="90" y="199">01 / YOUR CODING AGENT</text><text x="500" y="199">02 / GROUNDWORK</text><text x="1000" y="199">03 / YOUR REPOSITORY</text></g>
    <g fill="#f3f5ed" font-size="25" font-weight="700"><text x="90" y="247">Claude Code</text><text x="90" y="285">Codex</text><text x="90" y="323">Cursor</text><text x="500" y="247">MCP navigation + hooks</text><text x="1000" y="247">A live, local index</text></g>
    <g fill="#a0b6ae" font-size="19"><text x="90" y="374">Your existing workflow.</text><text x="500" y="289">Find symbols. Reuse code.</text><text x="500" y="321">Check calls. Reduce waste.</text><text x="500" y="374">Token-budgeted answers.</text><text x="1000" y="289">Files, symbols, imports, calls,</text><text x="1000" y="321">literals and fingerprints.</text><text x="1000" y="374">tree-sitter → SQLite</text></g>
    <g fill="none" stroke="#b7f5cf" stroke-width="2" marker-end="url(#arrow)"><path d="M378 263H458"/><path d="M458 313H378"/><path d="M878 263H958"/><path d="M958 313H878"/></g>
    <g fill="#8db3a4" font-size="14" text-anchor="middle"><text x="418" y="246">query</text><text x="418" y="342">context</text><text x="918" y="246">refresh</text><text x="918" y="342">lookup</text></g>
    <path d="M64 438H1376" stroke="#29433a"/>
    <g fill="#a0b6ae" font-size="17"><text x="64" y="475">Changed files only.</text><text x="525" y="475">No hosted service or telemetry.</text><text x="1045" y="475">Hooks fail open on error.</text></g>
  </g>
</svg>
