<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1200" viewBox="0 0 640 1200" role="img" aria-labelledby="title desc">
  <title id="title">Groundwork local architecture</title>
  <desc id="desc">Your coding agent uses Groundwork's MCP navigation and hooks to query a local tree-sitter and SQLite index. Changed files refresh incrementally. No hosted service or telemetry; hooks fail open on errors.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#b7f5cf"/></marker></defs>
  <rect width="640" height="1200" rx="20" fill="#081314"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="40" y="56" fill="#b7f5cf" font-size="22" letter-spacing="2">THE LOCAL CONTEXT LAYER</text>
    <g fill="#f3f5ed" font-size="38" font-weight="700"><text x="40" y="116">Your agent, grounded</text><text x="40" y="162">in your repository.</text></g>
    <g fill="#10221f" stroke="#345347"><rect x="40" y="214" width="560" height="220" rx="14"/><rect x="40" y="518" width="560" height="220" rx="14"/><rect x="40" y="822" width="560" height="220" rx="14"/></g>
    <g fill="#b7f5cf" font-size="22" letter-spacing="1"><text x="68" y="258">01 / YOUR CODING AGENT</text><text x="68" y="562">02 / GROUNDWORK</text><text x="68" y="866">03 / YOUR REPOSITORY</text></g>
    <g fill="#f3f5ed" font-size="32" font-weight="700"><text x="68" y="314">Claude Code · Codex · Cursor</text><text x="68" y="618">MCP navigation + hooks</text><text x="68" y="922">A live, local index</text></g>
    <g fill="#a0b6ae" font-size="28"><text x="68" y="365">Your existing workflow.</text><text x="68" y="669">Find. Reuse. Check.</text><text x="68" y="973">tree-sitter → SQLite</text></g>
    <g fill="none" stroke="#b7f5cf" stroke-width="3" marker-end="url(#arrow)"><path d="M320 450V500"/><path d="M320 754V804"/></g>
    <g fill="#a0b6ae" font-size="27" text-anchor="middle"><text x="320" y="1104">Local state. No telemetry.</text><text x="320" y="1150">Hooks fail open on errors.</text></g>
  </g>
</svg>
